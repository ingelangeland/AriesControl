# Bygger appen, legger den ut som «Siste versjon», og tester den i en Android-emulator med skjermbilder.
name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pakk ut AriesControl.zip (hvis lastet opp som zip)
        run: |
          ZIP=$(ls -t AriesControl*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d /tmp/prosjekt
            cp -r /tmp/prosjekt/AriesControl/. .
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Godta Android-lisenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Bygg appen (optimalisert)
        run: gradle :app:assembleRelease --stacktrace

      - name: Gi filen et tydelig navn
        run: |
          mkdir -p ut
          cp app/build/outputs/apk/release/app-release.apk ut/AriesControl.apk
          # Version info for the built-in updater
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > ut/version.json
          ls -l ut

      - uses: actions/upload-artifact@v4
        with:
          name: AriesControl-APK
          path: ut/AriesControl.apk

      - name: Legg ut som nedlastbar versjon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siste
          name: Latest version
          prerelease: false
          make_latest: true
          files: |
            ut/AriesControl.apk
            ut/version.json
          body: |
            AriesControl.apk – install on your Android phone.
            The app updates itself after this (menu ⋮ → Check for updates).

  simulate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Pakk ut AriesControl.zip (hvis lastet opp som zip)
        run: |
          ZIP=$(ls -t AriesControl*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d /tmp/prosjekt
            cp -r /tmp/prosjekt/AriesControl/. .
          fi

      - uses: actions/download-artifact@v4
        with:
          name: AriesControl-APK
          path: ut

      - name: Slå på maskinvareakselerasjon for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Kjør test i emulator (telefon)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x2340
          script: bash tools/simulate.sh

      - name: Legg ut testresultat
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: simulering
          name: Test (skjermbilder og rapport)
          prerelease: true
          make_latest: false
          files: |
            sim/*.png
            sim/*.txt

      - name: Feil hvis appen krasjet
        run: test ! -f sim/KRASJ.txt

      - name: Feil hvis en endring ikke kom fram til Aries
        run: grep -q "^OK" sim/RAPPORT-set.txt

      - name: Feil hvis Wi-Fi-oppsettet ikke kom fram til Aries
        run: grep -q "^OK" sim/RAPPORT-wifi.txt

      - name: Feil hvis musikkontrollen ikke kom fram til Aries
        run: grep -q "^OK" sim/RAPPORT-music.txt
